# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

name: Sync Projects

on:
  push:
    branches: [main]
    paths:
      - projects.yml
      - scripts/render-readme.mjs
      - .github/workflows/sync-projects.yml
  schedule:
    - cron: '17 6 * * *'
  workflow_dispatch:

# PERMISSIONS PER JOB: a workflow-level block caps every called body, so the
# grant lives on the job that calls one.
jobs:
  sync:
    name: Sync Projects
    permissions:
      contents: read
    uses: kirchDev/workflows/.github/workflows/_open-regenerated-pr.yml@94cbcbd676b989ac6c6327055a240132f5cd76a5 # v0.8.0
    with:
      # The renderer queries the GitHub API once per project it lists, so it
      # needs a token — the body passes the caller's own.
      build-command: pnpm render
      paths: README.md
      branch: bot/sync-projects
      title: 'chore: sync projects list'
      assignees: TitusKirch
      app-id: '3831936'
      body: |
        ## Sync the rendered projects list

        Rebuilt from `projects.yml` and live GitHub repository metadata.
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
