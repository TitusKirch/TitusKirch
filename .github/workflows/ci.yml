# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The lint/format gate comes from this repo's own `check` script in
# package.json. The README render assertion does NOT: it calls the GitHub API
# for every project it lists, so it needs a token, and `_ci-check.yml` runs its
# tasks with no credential on purpose. That is the documented "body plus one
# thing" case — the repo writes its own job rather than the body growing a
# switch for a single caller.
name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - LICENSE

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@f81bbe5fb5e8055b55a1ef5f861cc63a8e253622 # v0.1.3

  render:
    name: Renderer smoke
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm render

      - name: Assert README is in sync with projects.yml
        run: git diff --exit-code README.md
