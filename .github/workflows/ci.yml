# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The lint/format gate comes from this repo's own `check` script in
# package.json. The README render assertion does NOT: it calls the GitHub API
# for every project it lists, so it needs a token, and `_ci-check.yml` runs its
# tasks with no credential on purpose. That is the documented "body plus one
# thing" case — the repo writes its own job rather than the body growing a
# switch for a single caller.
name: CI

on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]

# NO `paths-ignore`, AND THAT IS THE POINT OF THE GATE. A change touching only
# prose cannot break a lint — but a workflow that does not TRIGGER reports no
# check at all, and a required check that never reports does not pass the merge,
# it blocks it forever. `CI / Gate` is meant to be a required check, so this
# workflow has to run on every pull request, including a README-only one.

permissions:
  contents: read

jobs:
  check:
    name: CI
    uses: kirchDev/workflows/.github/workflows/_ci-check.yml@bec834b87a96c8c1dbf2c7cb28f774e9173e32d7 # v0.2.0

  render:
    name: Renderer smoke
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Render README
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: pnpm render

      - name: Assert README is in sync with projects.yml
        run: git diff --exit-code README.md
