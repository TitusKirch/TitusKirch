# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The body reads the integration branch off the pull request's own base, so the
# `branches:` filter below is the only place it is named.
name: Queue Branch

on:
  pull_request:
    branches:
      - main
    types: [opened]

jobs:
  queue-branch:
    name: Queue Branch
    permissions:
      contents: read
      pull-requests: write
    uses: kirchDev/workflows/.github/workflows/_queue-branch.yml@6bc504fa084484ebf4813f1e03103c26af6d82c5 # v0.12.1
    secrets:
      BWS_ACCESS_TOKEN: ${{ secrets.BWS_ACCESS_TOKEN }}
