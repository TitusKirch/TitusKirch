# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json

# The sync branch is re-pointed at main on every run, so merging its pull
# request never deletes it — GitHub's "delete branch on merge" removes a branch
# the merge made obsolete, and this one is immediately obsolete again.
name: Cleanup Sync Branch

on:
  pull_request:
    types: [closed]

jobs:
  cleanup-sync-branch:
    name: Cleanup Sync Branch
    permissions:
      contents: write
    uses: kirchDev/workflows/.github/workflows/_cleanup-sync-branch.yml@b7bc3408448d1c0c1266e8c5fe2788c9cf120790 # v0.5.0
